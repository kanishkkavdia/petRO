<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>petRO Dashboard</title>
  <style>
    :root {
      --theme-color: #3b9eff;
      --bg: #090d18;
      --surface: #101623;
      --card: #141e30;
      --green: #4caf50;
      --red: #f44336;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background: var(--bg); color: #fff; display: flex; flex-direction: column; height: 100vh; overflow: hidden; transition: background 0.3s ease; }
    
    header { background: var(--surface); padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .brand { font-size: 1.4rem; font-weight: bold; color: var(--theme-color); }
    .badges { display: flex; gap: 10px; align-items: center; }
    .badge { padding: 5px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; cursor: pointer; border: none; transition: all 0.2s; }
    .ble-off { background: #333; color: #aaa; }
    .ble-on { background: var(--green); color: #fff; }
    .ble-spin { background: #ff9800; color: #fff; animation: spin 1s infinite linear; }
    .key-missing { background: var(--red); color: #fff; }
    .key-set { background: #512da8; color: #fff; }
    .pill { background: rgba(255,255,255,0.1); padding: 5px 12px; border-radius: 20px; font-size: 0.8rem; }

    main { flex: 1; display: flex; overflow: hidden; position: relative; }
    
    /* Left Panel: Animated Robo Face & Camera */
    .left-panel { width: 45%; display: flex; flex-direction: column; background: rgba(0,0,0,0.2); border-right: 1px solid rgba(255,255,255,0.05); position: relative; }
    .face-container { flex: 1; display: flex; justify-content: center; align-items: center; padding: 20px; position: relative; }
    .face-svg { width: 100%; max-width: 400px; aspect-ratio: 4/3; }
    
    .cam-preview-container { position: absolute; bottom: 15px; left: 15px; width: 110px; height: 85px; border-radius: 8px; overflow: hidden; border: 2px solid var(--theme-color); background: #000; }
    #webcamView { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }

    /* Right Panel: Chat Log & Dashboard Controllers */
    .right-panel { width: 55%; display: flex; flex-direction: column; overflow: hidden; }
    .chat-container { flex: 1; display: flex; flex-direction: column; overflow-hidden; background: rgba(21, 32, 54, 0.3); }
    .messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
    .msg { display: flex; flex-direction: column; max-width: 80%; }
    .msg.user { align-self: flex-end; align-items: flex-end; }
    .msg.bot { align-self: flex-start; align-items: flex-start; }
    .msg-label { font-size: 0.75rem; color: #888; margin-bottom: 3px; }
    .msg-bubble { padding: 12px 16px; border-radius: 16px; font-size: 0.95rem; line-height: 1.4; word-break: break-word; }
    .user .msg-bubble { background: var(--theme-color); color: #fff; border-bottom-right-radius: 4px; }
    .bot .msg-bubble { background: var(--surface); color: #eee; border-bottom-left-radius: 4px; border: 1px solid rgba(255,255,255,0.05); }
    
    /* Interactive elements & visual tools */
    .tool-calls { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 5px; }
    .tool-pill { background: rgba(0,0,0,0.3); font-size: 0.75rem; padding: 3px 8px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.1); color: #ffeb3b; }
    .typing-indicator .msg-bubble { display: flex; gap: 4px; padding: 12px; }
    .dot { width: 8px; height: 8px; background: #aaa; border-radius: 50%; animation: wave 1.3s infinite ease-in-out; }
    .dot:nth-child(2) { animation-delay: -1.1s; }
    .dot:nth-child(3) { animation-delay: -0.9s; }

    /* Control Modules Layout */
    .control-modules { background: var(--surface); padding: 15px; border-top: 1px solid rgba(255,255,255,0.05); }
    .upload-preview-bar { display: none; align-items: center; gap: 10px; background: rgba(255,255,255,0.05); padding: 8px; border-radius: 6px; margin-bottom: 10px; }
    .upload-preview-bar img { height: 40px; width: 40px; object-fit: cover; border-radius: 4px; }
    
    .input-row { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
    .input-row input { flex: 1; background: var(--bg); border: 1px solid rgba(255,255,255,0.1); padding: 12px; border-radius: 8px; color: #fff; font-size: 1rem; }
    .input-row input:focus { border-color: var(--theme-color); outline: none; }
    
    .icon-btn { background: rgba(255,255,255,0.08); border: none; color: #fff; width: 44px; height: 44px; border-radius: 8px; cursor: pointer; display: flex; justify-content: center; align-items: center; font-size: 1.2rem; transition: background 0.2s; }
    .icon-btn:hover { background: rgba(255,255,255,0.15); }
    .mic-listening { background: var(--red); animation: pulse 1.5s infinite; }
    .mic-wake { background: var(--green); }
    .speaking { background: #e91e63; }
    .primary-btn { background: var(--theme-color); border: none; color: #fff; padding: 0 20px; height: 44px; border-radius: 8px; font-weight: bold; cursor: pointer; }

    /* Drive Controls Grid */
    .dashboard-grid { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.05); }
    .d-pad { display: grid; grid-template-columns: repeat(3, 40px); grid-template-rows: repeat(3, 40px); gap: 5px; }
    .d-btn { background: #253047; border: none; color: #fff; font-weight: bold; border-radius: 6px; cursor: pointer; user-select: none; display: flex; align-items: center; justify-content: center; }
    .d-btn:active { background: var(--theme-color); }
    .action-row { display: flex; gap: 6px; flex-wrap: wrap; }
    .act-btn { background: #222b3e; border: 1px solid rgba(255,255,255,0.05); color: #eee; padding: 6px 14px; border-radius: 6px; font-size: 0.85rem; cursor: pointer; }
    .act-btn:hover { background: #2c3852; border-color: var(--theme-color); }

    /* Media overlay layouts */
    #ytContainer { position: absolute; inset: 0; background: #000; display: none; flex-direction: column; z-index: 10; }
    #ytPlayerDiv { flex: 1; width: 100%; height: 100%; }
    .yt-close-btn { background: var(--red); color: #fff; border: none; padding: 12px; font-weight: bold; cursor: pointer; text-align: center; }
    #miniPetroArea { position: absolute; top: 10px; right: 10px; width: 100px; height: 75px; background: rgba(0,0,0,0.8); border: 1px solid var(--theme-color); border-radius: 6px; display: none; z-index: 11; pointer-events: none; }

    /* Modal Overlay */
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center; opacity: 0; pointer-events: none; transition: opacity 0.2s ease; z-index: 100; }
    .modal.open { opacity: 1; pointer-events: auto; }
    .modal-content { background: var(--surface); width: 90%; max-width: 500px; border-radius: 12px; padding: 25px; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; font-size: 1.2rem; font-weight: bold; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; }
    .form-group { margin-bottom: 15px; display: flex; flex-direction: column; gap: 5px; }
    .form-group label { font-size: 0.85rem; color: #aaa; }
    .form-group input, .form-group select { background: var(--bg); border: 1px solid rgba(255,255,255,0.1); padding: 10px; border-radius: 6px; color: #fff; }
    .info-box { background: rgba(255,255,255,0.03); padding: 10px; border-radius: 6px; font-size: 0.85rem; line-height: 1.5; color: #ccc; margin-top: 10px; border: 1px solid rgba(255,255,255,0.05); }

    #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px); background: rgba(0,0,0,0.85); color: #fff; padding: 10px 25px; border-radius: 30px; font-size: 0.9rem; z-index: 1000; pointer-events: none; transition: transform 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28); border: 1px solid rgba(255,255,255,0.1); text-align: center; }
    #toast.show { transform: translateX(-50%) translateY(0); }

    /* Keyframes */
    @keyframes wave { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-6px); } }
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); box-shadow: 0 0 10px rgba(244,67,54,0.5); } 100% { transform: scale(1); } }
    @keyframes spin { 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <header>
    <div class="brand">petRO 🤖</div>
    <div class="badges">
      <div id="memoryPill" class="pill">Memory: 0 / 50 msgs</div>
      <button id="bleBtn" class="badge ble-off" onclick="toggleBLE()">⚫ BLE</button>
      <button id="keyBadge" class="badge key-missing" onclick="openSettings()">🔑 KEY</button>
      <button class="icon-btn" style="width:32px; height:32px; font-size:1rem;" onclick="openSettings()">⚙️</button>
    </div>
  </header>

  <main>
    <!-- Left Dynamic Screen (Face + Overlays) -->
    <div class="left-panel">
      
      <!-- Video Overlay Section -->
      <div id="ytContainer">
        <div id="ytPlayerDiv"></div>
        <button class="yt-close-btn" onclick="closeYouTube()">✕ Close Media Stream</button>
      </div>
      
      <!-- Picture-In-Picture Mini Robo Screen for Video Mode -->
      <div id="miniPetroArea"></div>

      <!-- Expressive Core Screen -->
      <div class="face-container" onclick="toggleFullscreen()">
        <svg class="face-svg" viewBox="0 0 400 300">
          <defs>
            <!-- Face Glow Custom Mapping Shader -->
            <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
              <feGaussianBlur stdDeviation="6" result="blur" />
              <feComposite in="SourceGraphic" in2="blur" operator="over" />
            </filter>
            
            <!-- Structural Clipping Masks for Blinking Layers -->
            <clipPath id="leftEyeClip">
              <circle cx="120" cy="110" r="45" />
            </clipPath>
            <clipPath id="rightEyeClip">
              <circle cx="280" cy="110" r="45" />
            </clipPath>
            
            <!-- Dynamic Linear Gradients Configured Programmatically -->
            <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop id="stop1-2" offset="0%" stop-color="#3b9eff" />
              <stop id="stop2-2" offset="100%" stop-color="#051c38" />
            </linearGradient>
          </defs>

          <!-- Screen Base Layer Background Configuration -->
          <rect id="faceBg" width="400" height="300" rx="30" fill="#090d18" transition="fill 0.3s"/>

          <!-- THEME GRAPHIC OVERLAYS (Controlled safely via SVG Groups) -->
          <g id="theme-decorations">
            <!-- Dog Ears -->
            <path id="theme-dog" d="M 50 40 Q 20 100 60 140 M 350 40 Q 380 100 340 140" stroke="#ff9800" stroke-width="8" stroke-linecap="round" fill="none" style="opacity:0;" />
            <!-- Terminator Cybernetic Plate -->
            <path id="theme-terminator" d="M 60 40 L 150 40 L 130 170 L 60 110 Z" fill="rgba(255,51,51,0.15)" stroke="#ff3333" stroke-width="2" style="opacity:0;" />
            <!-- Monkey Audio Rings -->
            <g id="theme-monkey" style="opacity:0;">
              <circle cx="45" cy="110" r="20" fill="none" stroke="#8bc34a" stroke-width="4" />
              <circle cx="355" cy="110" r="20" fill="none" stroke="#8bc34a" stroke-width="4" />
            </g>
            <!-- Star Wars Astromech Panel Elements -->
            <path id="theme-starwars" d="M 180 25 L 220 25 M 200 15 L 200 25" stroke="#00e5ff" stroke-width="4" style="opacity:0;" />
          </g>

          <!-- PROPS STRUCTURAL INVENTORY LAYERS -->
          <g id="props-group" pointer-events="none">
            <text id="prop-apple" x="200" y="70" font-size="40" text-anchor="middle" style="opacity:0; transition:opacity 0.3s;">🍎</text>
            <text id="prop-book" x="200" y="70" font-size="40" text-anchor="middle" style="opacity:0; transition:opacity 0.3s;">📘</text>
            <text id="prop-dumbbell" x="200" y="70" font-size="40" text-anchor="middle" style="opacity:0; transition:opacity 0.3s;">💪</text>
            <text id="prop-laptop" x="200" y="70" font-size="40" text-anchor="middle" style="opacity:0; transition:opacity 0.3s;">💻</text>
          </g>

          <!-- Left Eyebrow & Graphic Elements -->
          <g id="lBrowContainer">
            <line id="lBrow" x1="85" y1="50" x2="155" y2="50" stroke="#fff" stroke-width="6" stroke-linecap="round" style="transform-origin: 120px 50px; transition: transform 0.2s;" />
          </g>
          <!-- Right Eyebrow & Graphic Elements -->
          <g id="rBrowContainer">
            <line id="rBrow" x1="245" y1="50" x2="315" y2="50" stroke="#fff" stroke-width="6" stroke-linecap="round" style="transform-origin: 280px 50px; transition: transform 0.2s;" />
          </g>

          <!-- LEFT EXPRESSIVE ASSEMBLY -->
          <g id="leftEyeAssembly">
            <circle id="lRim" cx="120" cy="110" r="47" fill="none" stroke="#3b9eff" stroke-width="2" filter="url(#glow)" />
            <g clip-path="url(#leftEyeClip)">
              <circle id="lIris" cx="120" cy="110" r="45" fill="url(#cyberGrad)" />
              <circle id="lPupil" cx="120" cy="110" r="20" fill="#000" />
              <circle id="lHL1" cx="110" cy="100" r="7" fill="#fff" />
              <circle id="lHL2" cx="130" cy="120" r="3.5" fill="#fff" />
            </g>
            <!-- Blinking Mechanics Cover Plates -->
            <rect id="lLidTop" x="70" y="60" width="100" height="0" fill="#101623" />
            <rect id="lLidBot" x="70" y="160" width="100" height="0" fill="#101623" />
          </g>

          <!-- RIGHT EXPRESSIVE ASSEMBLY -->
          <g id="rightEyeAssembly">
            <circle id="rRim" cx="280" cy="110" r="47" fill="none" stroke="#3b9eff" stroke-width="2" filter="url(#glow)" />
            <g clip-path="url(#rightEyeClip)">
              <circle id="rIris" cx="280" cy="110" r="45" fill="url(#cyberGrad)" />
              <circle id="rPupil" cx="280" cy="110" r="20" fill="#000" />
              <circle id="rHL1" cx="270" cy="100" r="7" fill="#fff" />
              <circle id="rHL2" cx="290" cy="120" r="3.5" fill="#fff" />
            </g>
            <!-- Blinking Mechanics Cover Plates -->
            <rect id="rLidTop" x="230" y="60" width="100" height="0" fill="#101623" />
            <rect id="rLidBot" x="230" y="160" width="100" height="0" fill="#101623" />
          </g>

          <!-- MOUTH GRAPHIC PATHWAYS -->
          <g id="mouthRim">
             <!-- Static decorative container backboard if desired -->
          </g>
          <g id="mouthGroup">
            <path id="mouthPath" d="M 150 210 Q 200 225 250 210 Q 200 215 150 210 Z" fill="#fff" filter="url(#glow)" style="transition: d 0.2s;" />
          </g>
        </svg>
      </div>

      <!-- Built-In WebCam Mirror Core Layout -->
      <div class="cam-preview-container">
        <video id="webcamView" autoplay playsinline></video>
        <canvas id="captureCanvas" style="display:none;"></canvas>
      </div>
    </div>

    <!-- Right Interaction Screen (Chat Processing Engine) -->
    <div class="right-panel">
      <div class="chat-container">
        <div id="messages" class="messages">
          <div class="msg bot">
            <div class="msg-label">petRO 🤖</div>
            <div class="msg-bubble">System loaded securely. Let's explore together! ✨</div>
          </div>
        </div>
        
        <!-- Script Control Modules Dock -->
        <div class="control-modules">
          <!-- Real-Time Upload Frame View -->
          <div id="uploadPreviewBar" class="upload-preview-bar">
            <img id="previewImg" src="" alt="Upload Frame Snapshot">
            <span style="font-size:0.85rem; flex:1; color:#aaa;">Image appended to conversation sequence...</span>
            <button class="act-btn" style="padding:4px 8px;" onclick="clearUploadedImage()">✕</button>
          </div>

          <div class="input-row">
            <input id="userInput" type="text" placeholder="Talk to petRO or input command instructions..." />
            <button id="micBtn" class="icon-btn" onclick="toggleMicMode()">🎤</button>
            <button id="ttsBtn" class="icon-btn" onclick="stopTTS()">🔊</button>
            <button id="sendBtn" class="primary-btn" onclick="sendChat()">SEND</button>
          </div>

          <!-- Manual Drive Grid Controller Layout Wrapper -->
          <div id="normalControls" class="dashboard-grid">
            <div class="d-pad">
              <div></div>
              <button id="btnF" class="d-btn">▲</button>
              <div></div>
              <button id="btnL" class="d-btn">◀</button>
              <button id="btnS" class="d-btn" onclick="bleSend('S')" style="background:#5c2525;">■</button>
              <button id="btnR" class="d-btn">▶</button>
              <div></div>
              <button id="btnB" class="d-btn">▼</button>
              <div></div>
            </div>

            <!-- Prebuilt Shortcut Micro Triggers -->
            <div class="action-row">
              <button class="act-btn" onclick="doAction('dance')">💃 Dance</button>
              <button class="act-btn" onclick="doAction('wander')">🗺 Wander</button>
              <button class="act-btn" onclick="doAction('nod')">🤷 Nod</button>
              <button class="act-btn" onclick="manualCapture()">📸 Capture</button>
              <button id="gyroBtn" class="act-btn" style="background: #1b3a24; border-color: var(--green);" onclick="enableMotionSensors()">📱 Sync Gyro</button>
              <button class="act-btn" style="color:var(--red);" onclick="clearChat()">🗑 Clear</button>
              
              <!-- Clean structural file-upload pipeline anchor -->
              <label class="act-btn" style="display:inline-block; cursor:pointer; text-align:center;">
                📁 Upload File <input id="fileInput" type="file" accept="image/*" style="display:none;" onchange="handleFileUpload(e)">
              </label>
            </div>
          </div>
          
        </div>
      </div>
    </div>
  </main>

  <!-- Setup configuration modal mapping layout screen -->
  <div id="settingsModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <span>Control Settings Console</span>
        <button class="icon-btn" style="width:28px; height:28px; font-size:0.9rem;" onclick="closeSettings()">✕</button>
      </div>
      
      <div class="form-group">
        <label>Gemini 2.5 Flash API Key Setup</label>
        <div style="display:flex; gap:5px;">
          <input id="apiKeyInput" type="password" style="flex:1;" placeholder="AIzaSy..." />
          <button id="eyeBtn" class="icon-btn" style="width:40px; height:40px;" onclick="toggleKeyVisibility()">👁</button>
        </div>
        <div style="display:flex; gap:10px; margin-top:5px;">
          <button class="act-btn" style="background:var(--green); color:#fff; border:none;" onclick="saveApiKey()">Save Key</button>
          <button class="act-btn" style="background:var(--red); color:#fff; border:none;" onclick="clearApiKey()">Remove Key</button>
        </div>
        <div id="keyStatus" class="info-box">Checking validation states...</div>
      </div>

      <div class="form-group">
        <label>Personalization Options</label>
        <input id="userNameInput" type="text" placeholder="Enter owner name..." onchange="savePersonalization()"/>
      </div>

      <div class="form-group">
        <label>System Theme Model</label>
        <select id="themeSelect" onchange="savePersonalization()">
          <option value="default">Default Blue Mech</option>
          <option value="dog">Energetic Robot Dog</option>
          <option value="terminator">T-800 Infiltration Agent</option>
          <option value="monkey">Cheeky Jungle Monkey</option>
          <option value="starwars">Helpful Astromech Droid</option>
          <option value="transformer">Optimus Prime (Autobot Mode)</option>
        </select>
      </div>

      <div class="form-group">
        <label>Auto Conversational Follow-Up Prompts</label>
        <select id="followUpSelect" onchange="savePersonalization()">
          <option value="0">Disabled (Manual Only)</option>
          <option value="5">Every 5 Seconds Quiet</option>
          <option value="10">Every 10 Seconds Quiet</option>
          <option value="20">Every 20 Seconds Quiet</option>
        </select>
      </div>

      <div class="info-box" id="bleInfoBox">GATT Status: Disconnected</div>
      <div class="info-box" id="usageBox">Token Data Usage: 0 In / 0 Out</div>
      <button class="act-btn" style="width:100%; margin-top:10px; background:#2c3545;" onclick="clearUsage()">Reset Storage Tokens usage counters</button>
    </div>
  </div>

  <div id="toast">Message Notification Frame</div>

  <!-- Load Global YouTube Iframe Player Lifecycle Framework Hook -->
  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="script.js"></script>
</body>
</html>
